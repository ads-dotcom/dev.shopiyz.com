  "info": {
    "title": "Shopiyz Storefront API",
    "version": "2026-10-04",
    "description": "Native REST contract for hosted and future React storefronts. Same-origin reads may be tokenless. Cross-origin headless access needs a storefront credential and exact allowed Origin. Native services remain authoritative for availability, price, tax, shipping, customers and payment. Designs are exact published JSON. Response objects are extensible; store-specific availability is read from shop/configuration. Account v2 and managed checkout are separate native boundaries."
  },
  "servers": [
    {
      "url": "/api/storefront/v1",
      "description": "This exact customer origin"
    }
  ],
  "x-shopiyz-customer-account-base-path": "/api/storefront/v2/account",
  "x-shopiyz-customer-account-openapi": "/api/storefront/v2/account/openapi.json",
  "externalDocs": {
    "description": "Admin, Storefront, Account v2 and Studio API boundaries and contracts",
    "url": "https://dev.shopiyz.com/guides/api-families"
  },
